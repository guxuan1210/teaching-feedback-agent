[project]
name = "teaching-feedback-demo"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn", "jinja2", "python-multipart", "sqlalchemy", "openpyxl", "httpx", "python-dotenv", "wecom-aibot-python-sdk"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"

[tool.setuptools.packages.find]
include = ["app*"]
