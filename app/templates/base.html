<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}教学反馈数据采集{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <nav>
    <a href="/">今日填写</a>
    <a href="/history">历史记录</a>
    <a href="/catalog">基础信息</a>
    <a href="/catalog/students">学生</a>
    <a href="/catalog/classes">班级</a>
    <a href="/catalog/teachers">教师</a>
    <a href="/catalog/enrollments">报名管理</a>
  </nav>

  {% if created %}
    <div class="flash success">已创建记录 ID：{{ created }}</div>
  {% endif %}
  {% if errors %}
    <div class="flash error">
      {% for error in errors %}<p>{{ error }}</p>{% endfor %}
    </div>
  {% endif %}

  {% block content %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
