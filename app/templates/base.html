<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}教学反馈数据采集{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; color: #1f2937; }
    nav { margin-bottom: 1.5rem; }
    nav a { margin-right: 1rem; text-decoration: none; color: #2563eb; }
    .flash { padding: 0.75rem 1rem; margin: 1rem 0; border-radius: 6px; }
    .flash.success { background: #ecfdf5; border: 1px solid #a7f3d0; color: #065f46; }
    .flash.error { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }
    .flash.error p { margin: 0.25rem 0; }
    table { border-collapse: collapse; width: 100%; margin-top: 1.5rem; }
    th, td { border: 1px solid #e5e7eb; padding: 0.5rem; text-align: left; }
    th { background: #f9fafb; }
    form.inline { display: inline; }
    input, select, button { padding: 0.3rem 0.5rem; margin: 0.2rem; }
    .create-form { background: #f9fafb; padding: 1rem; border-radius: 6px; }
    .workspace { display: flex; gap: 2rem; align-items: flex-start; }
    .roster { flex: 0 0 240px; }
    .roster ul { list-style: none; padding: 0; }
    .roster li { margin: 0.25rem 0; }
    .roster li.active a { font-weight: 700; color: #1f2937; }
    .form-area { flex: 1; }
    .chip { font-size: 0.75rem; padding: 0.1rem 0.4rem; border-radius: 999px; background: #e5e7eb; color: #374151; }
    fieldset { margin: 1rem 0; border: 1px solid #e5e7eb; border-radius: 6px; padding: 0.75rem; }
    legend { font-weight: 600; }
    .rating { margin: 0.5rem 0; }
    .rating-label { display: inline-block; min-width: 6rem; }
    .rating-option { margin-right: 0.75rem; }
    .checkbox { display: block; margin: 0.25rem 0; }
    .muted { color: #6b7280; }
    @media (max-width: 800px) { .workspace { flex-direction: column; } .roster { flex: none; width: 100%; } }
  </style>
</head>
<body>
  <nav>
    <a href="/catalog">概览</a>
    <a href="/catalog/students">学生</a>
    <a href="/catalog/classes">班级</a>
    <a href="/catalog/teachers">教师</a>
    <a href="/catalog/enrollments">报名管理</a>
  </nav>

  {% if created %}
    <div class="flash success">已创建记录 ID：{{ created }}</div>
  {% endif %}
  {% if errors %}
    <div class="flash error">
      {% for error in errors %}<p>{{ error }}</p>{% endfor %}
    </div>
  {% endif %}

  {% block content %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
